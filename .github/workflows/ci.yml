# Desktop CI: the pre-merge verify gate. Runs on every push/PR.
# analyze + test only: engine tests run against temp dirs and a mocked API,
# no GTK build deps needed. Read-only token, pinned majors.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Translations (FR ARB complete, #32)
        # gen-l10n validates placeholder/ICU parity (errors on a mismatch) and
        # lists untranslated keys in the untranslated-messages-file; a "[" in it
        # means a key lacks its FR value, so the build fails instead of shipping
        # an English fallback in French.
        run: |
          flutter gen-l10n
          if grep -q "\[" lib/l10n/untranslated.txt; then
            echo "::error::untranslated FR messages:"; cat lib/l10n/untranslated.txt; exit 1
          fi
      - name: Leak scan (strings that must never ship)
        run: |
          # Mirrors the leak scan in dev/verify.sh — keep the two in step.
          # dev/forbidden-terms.local.txt is gitignored and normally absent
          # here; the scan runs on the committed list alone when it is.
          # #404: a missing terms file makes `grep -f` exit 2, the `if` below
          # false, and the step green having scanned nothing — fail-open.
          [ -s dev/forbidden-terms.txt ] || { echo "::error::dev/forbidden-terms.txt missing or empty"; exit 1; }
          # Strip comments and blank lines: `grep -f` reads every line as a
          # pattern, and a blank one matches each line of each file scanned.
          terms=$(mktemp)
          cat dev/forbidden-terms.txt dev/forbidden-terms.local.txt 2>/dev/null \
            | grep -vE '^[[:space:]]*(#|$)' > "$terms"
          [ -s "$terms" ] || { echo "::error::no patterns left after stripping comments"; exit 1; }
          if git ls-files | xargs grep -InE -f "$terms" \
               | grep -viE "\.lock$|^dev/forbidden-terms\.txt:"; then
            echo "::error::forbidden term(s) found above"; exit 1
          fi
      - name: Secret scan
        # Binary download rather than gitleaks-action: the org Actions policy
        # only allows GitHub-owned + verified-creator actions.
        run: |
          v=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner .
      - name: REUSE lint (per-file SPDX licensing, #30)
        # Python tool; the org Actions policy blocks fsfe/reuse-action, so run it
        # via pipx (preinstalled on the runner). The charset-normalizer extra
        # supplies reuse's encoding detection without needing libmagic.
        run: pipx run --spec 'reuse[charset-normalizer]' reuse lint
